<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm"><rect width="210" height="297" fill="#fff"/><g transform="translate(30.00,25.00) scale(2.00)"><path d="M0,-5.6 L5.8,4.2 L-5.8,4.2 Z" fill="#fff" stroke="#000" stroke-width="0.35" stroke-linejoin="round" stroke-linecap="round"/><rect x="-0.45" y="-2.60" width="0.90" height="4.00" rx="0.30" fill="#000" stroke="#000" stroke-width="0"/><circle cx="0" cy="2.7" r="0.55" fill="#000"/></g><text x="13.00" y="58.00" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="5.64" font-weight="700" text-anchor="start">WICHTIG – SORGFÄLTIG LESEN UND AUFBEWAHREN</text><text x="13.00" y="69.62" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Höchstlast: 40 kg auf der Platte, gleichmässig verteilt.</text><text x="13.00" y="77.95" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Zu zweit aufbauen und wenden: Der Altar wiegt fertig rund 40 kg. Die Platte liegt beim Aufbau mit der Oberseite auf Decken.</text><text x="13.00" y="86.29" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Geleimt ist nichts, Stahl sieht man keinen.</text><text x="13.00" y="94.62" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Nach dem ersten Winter die acht Muttern und die sechzehn Schrauben im Ring nachstellen.</text><text x="13.00" y="102.96" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Nicht am Fuss treten oder den Altar an den Füssen ziehen. Zum Verschieben an der Platte anheben, zu zweit.</text><text x="13.00" y="111.29" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Steht ein Fuss frei, Korkscheiben unterlegen.</text><text x="13.00" y="119.62" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Nichts in den Altar stellen.</text><text x="13.00" y="127.96" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="2.47" font-weight="400" text-anchor="start">Pflege: mit einem leicht feuchten Tuch reinigen. Geölte Oberflächen bei Bedarf nachölen.</text><text x="15.10" y="286.80" font-family="'Noto Sans', 'Helvetica Neue', Arial, sans-serif" font-size="3.18" font-weight="400" text-anchor="start">2</text></svg>